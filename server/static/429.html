<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>429 - Zu viele Anfragen | FlakeSecure</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <style>
    :root, [data-theme="dark"], html[data-theme="dark"] {
      --bg: #090b14;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.6);
    }
    [data-theme="light"], html[data-theme="light"], body[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-dim: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .error-code {
      font-family: 'DM Mono', monospace;
      font-size: 64px;
      font-weight: 800;
      background: linear-gradient(135deg, #E8B020, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      line-height: 1;
    }
    .error-title {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .error-desc {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      background: #E8B020;
      color: #07090e;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">429</div>
    <h1 class="error-title">Zu viele Anfragen</h1>
    <p class="error-desc">Aus Sicherheitsgründen und zum Schutz vor Denial-of-Service-Angriffen wurde das Anfrage-Limit für deine IP-Adresse vorübergehend erreicht. Bitte warte einen Moment und lade die Seite erneut.</p>
    <a href="/" class="btn">Erneut versuchen</a>
  </div>
</body>
</html>
