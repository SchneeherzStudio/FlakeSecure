<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - Serverfehler | FlakeSecure</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <style>
    :root, [data-theme="dark"], html[data-theme="dark"] {
      --bg: #090b14;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #ef4444;
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.6);
    }
    [data-theme="light"], html[data-theme="light"], body[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --accent: #dc2626;
      --text: #0f172a;
      --text-dim: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .error-code {
      font-family: 'DM Mono', monospace;
      font-size: 64px;
      font-weight: 800;
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      line-height: 1;
    }
    .error-title {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .error-desc {
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      background: #E8B020;
      color: #07090e;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 14px;
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">500</div>
    <h1 class="error-title">Interner Serverfehler</h1>
    <p class="error-desc">Ein unerwarteter Fehler ist aufgetreten. Unsere Administratoren wurden automatisch benachrichtigt. Bitte versuche es in wenigen Augenblicken erneut.</p>
    <a href="/" class="btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Zur Startseite
    </a>
  </div>
</body>
</html>
