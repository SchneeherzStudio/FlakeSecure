<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passwort zurücksetzen | FlakeSecure</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <script src="/js/theme.js?v=2.0.4"></script>
  <style>
    :root, [data-theme="dark"], html[data-theme="dark"] {
      --bg: #090b14;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #E8B020;
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.6);
      --input-bg: rgba(255, 255, 255, 0.05);
    }
    [data-theme="light"], html[data-theme="light"], body[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --accent: #D97706;
      --text: #0f172a;
      --text-dim: #475569;
      --input-bg: #f1f5f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .brand-icon { font-size: 28px; }
    .brand-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #E8B020;
      color: #07090e;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.95; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
    .notice-box {
      margin-top: 20px;
      padding: 14px;
      border-radius: 6px;
      background: rgba(232, 176, 32, 0.08);
      border: 1px solid rgba(232, 176, 32, 0.25);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 100 100" width="32" height="32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="resetLockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E8B020"/>
            <stop offset="100%" stop-color="#A07010"/>
          </linearGradient>
        </defs>
        <path d="M35 46 V34 A15 15 0 0 1 65 34 V46" fill="none" stroke="url(#resetLockGrad)" stroke-width="9" stroke-linecap="round"/>
        <rect x="22" y="44" width="56" height="44" rx="8" fill="url(#resetLockGrad)"/>
      </svg>
      <span class="brand-text">FlakeSecure</span>
    </div>
    <h1>Neues Passwort festlegen</h1>
    <p class="subtitle">Wähle ein sicheres neues Passwort (mind. 8 Zeichen, keine Leerzeichen).</p>

    <div id="alertBox" class="alert"></div>

    <form id="resetForm">
      <div class="form-group">
        <label for="password">Neues Passwort</label>
        <input type="password" id="password" required minlength="8" placeholder="••••••••••••">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Passwort wiederholen</label>
        <input type="password" id="confirmPassword" required minlength="8" placeholder="••••••••••••">
      </div>
      <button type="submit" id="submitBtn" class="btn">Passwort speichern</button>
    </form>

    <div class="notice-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 6px;" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      <strong>Zero-Knowledge Hinweis:</strong> Nach dem Zurücksetzen deines Passworts musst du deine Mobile App öffnen und biometrisch entsperren, um deinen Tresor mit dem neuen Schlüssel zu synchronisieren.
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    if (!token) {
      alertBox.className = 'alert alert-error';
      alertBox.style.display = 'block';
      alertBox.textContent = 'Ungültiger oder fehlender Reset-Token. Bitte fordere einen neuen Link an.';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        showAlert('Passwort muss mindestens 8 Zeichen lang sein.', true);
        return;
      }
      if (/\s/.test(password)) {
        showAlert('Passwort darf keine Leerzeichen enthalten.', true);
        return;
      }
      if (password !== confirmPassword) {
        showAlert('Die Passwörter stimmen nicht überein.', true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Speichere...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Fehler beim Zurücksetzen des Passworts');
        }

        showAlert(data.message || 'Passwort erfolgreich geändert! Du kannst dich jetzt anmelden.', false);
        form.reset();
        form.style.display = 'none';

        setTimeout(() => {
          window.location.href = '/account';
        }, 3000);
      } catch (err) {
        showAlert(err.message, true);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Passwort speichern';
      }
    });

    function showAlert(msg, isError) {
      alertBox.className = 'alert ' + (isError ? 'alert-error' : 'alert-success');
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
